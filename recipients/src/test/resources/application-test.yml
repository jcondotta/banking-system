app:
  environment: test
  kafka:
    topics:
      recipient-created:
        topic-name: recipients-created
      recipient-deleted:
        topic-name: recipients-deleted

spring:
  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

management:
  tracing:
    export:
      enabled: false
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4317
          transport: grpc
