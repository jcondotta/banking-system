name: banking

services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: banking-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=password
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - banking_network
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: banking-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - banking_network

  data-prepper:
    image: opensearchproject/data-prepper:2.8.0
    container_name: banking-data-prepper
    ports:
      - "2021:2021"
    volumes:
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - banking_network

  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka-1
    hostname: kafka-1
    networks:
      - banking_network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka-1:29092,
        PLAINTEXT_HOST://0.0.0.0:9092,
        CONTROLLER://kafka-1:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-1:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka-init
    restart: no
    depends_on:
      - kafka-1
    networks:
      - banking_network
    volumes:
      - ./kafka/01-create-topics.sh:/usr/local/bin/01-create-topics.sh
    entrypoint: [ "/bin/bash", "/usr/local/bin/01-create-topics.sh" ]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        kafka-1:29092
    networks:
      - banking_network

volumes:
  opensearch_data:
    name: banking-opensearch-data
  kafka_1_data:
    name: banking-kafka-1-data

networks:
  banking_network:
    name: banking_network
