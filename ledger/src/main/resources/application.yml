server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ledger
    version: "@project.version@"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 3
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  kafka:
    topics:
      bank-account-activated: ${KAFKA_BANK_ACCOUNT_ACTIVATED_TOPIC_NAME}
      internal-transfer-requested: ${KAFKA_INTERNAL_TRANSFER_REQUESTED_TOPIC_NAME}
    consumer:
      group-id: ledger-bank-account-provisioner
      transfer-group-id: ledger-internal-transfer-processor

management:
  endpoint:
    health:
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus

  metrics:
    tags:
      application: ${spring.application.name}
